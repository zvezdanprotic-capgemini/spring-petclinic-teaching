<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped">
    <tr>
      <th th:text="#{name}">Name</th>
      <td><b id="owner-name">Loading...</b></td>
    </tr>
    <tr>
      <th th:text="#{address}">Address</th>
      <td id="owner-address">Loading...</td>
    </tr>
    <tr>
      <th th:text="#{city}">City</th>
      <td id="owner-city">Loading...</td>
    </tr>
    <tr>
      <th th:text="#{telephone}">Telephone</th>
      <td id="owner-telephone">Loading...</td>
    </tr>
  </table>

  <a th:href="@{__${ownerId}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit
    Owner</a>
  <a th:href="@{__${ownerId}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <p>Pet information will be loaded dynamically.</p>
  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        var successMsg = document.getElementById("success-message");
        var errorMsg = document.getElementById("error-message");
        if (successMsg) successMsg.style.display = "none";
        if (errorMsg) errorMsg.style.display = "none";
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();

    // Load owner data
    const ownerId = window.location.pathname.split('/')[2];
    fetch(`/owners/${ownerId}/data`)
      .then(response => response.text())
      .then(data => {
        const ownerData = JSON.parse(data);
        document.getElementById('owner-name').textContent = ownerData.firstName + ' ' + ownerData.lastName;
        document.getElementById('owner-address').textContent = ownerData.address;
        document.getElementById('owner-city').textContent = ownerData.city;
        document.getElementById('owner-telephone').textContent = ownerData.telephone;
      })
      .catch(error => {
        console.error('Error loading owner data:', error);
        document.getElementById('owner-name').textContent = 'Error loading data';
        document.getElementById('owner-address').textContent = 'Error loading data';
        document.getElementById('owner-city').textContent = 'Error loading data';
        document.getElementById('owner-telephone').textContent = 'Error loading data';
      });
  </script>

</body>


</html>
